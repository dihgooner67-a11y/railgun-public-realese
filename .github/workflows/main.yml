name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: grep -n -E "error:|FAILED|What went wrong" -A3 build.log | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: railgun-jar
          path: |
            build/libs/*.jar
            build.log
